
<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Orbitron:wght@500;700&amp;display=swap');
  .bg { fill: #000000; stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; rx: 6px; }
  .title { font-family: 'Share Tech Mono', monospace; font-size: 16px; fill: #ffffff; letter-spacing: 0.15em; }
  .mono { font-family: 'Share Tech Mono', monospace; }
  .text-white { fill: #ffffff; }
  .text-dim { fill: rgba(255, 255, 255, 0.6); }
  .text-dark { fill: rgba(255, 255, 255, 0.3); }
  .text-red { fill: #ef4444; }
  .text-cyan { fill: #22d3ee; }
  .font-12 { font-size: 12px; }
  .font-14 { font-size: 14px; }
  .font-16 { font-size: 16px; }
  .font-bold { font-weight: bold; }
  .line-ui { stroke: rgba(255, 255, 255, 0.15); stroke-width: 1; }
  .corner { stroke: rgba(255, 255, 255, 0.3); stroke-width: 2; fill: none; }
  
  @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
  .anim-scan { animation: scan 4s linear infinite; }
</style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>
  
  <rect x="0.5" y="0.5" width="799" height="249" class="bg" />
  
  <text x="30" y="30" class="title">&gt; DOSSIER_RECORDS</text>
  <line x1="30" y1="45" x2="770" y2="45" class="line-ui" />
  <circle cx="20" cy="25" r="3" fill="#ef4444" filter="url(#glow)" />

  <g transform="translate(30, 70)">
    <!-- Left Column: YAML -->
    <text x="0" y="0" class="mono font-14 text-dim">AGENT_ID  : <tspan class="text-white">MOURTADA BOUIZAKARNE</tspan></text>
    <text x="0" y="22" class="mono font-14 text-dim">DEPT_ID   : <tspan class="text-red font-bold">DIGITAL ARCHITECT</tspan></text>
    <text x="0" y="44" class="mono font-14 text-dim">CLASS     : <tspan class="text-cyan font-bold">1337_Rabat (42 Network)</tspan></text>
    <text x="0" y="66" class="mono font-14 text-dim">STATUS    : <tspan class="text-white">████████████ ACTIVE</tspan></text>
    <text x="0" y="88" class="mono font-14 text-dim">CLEARANCE : <tspan class="text-white">LEVEL-04 // LOW_LEVEL_SYS</tspan></text>
    <text x="0" y="110" class="mono font-14 text-dim">NODE      : <tspan class="text-white">109.30.81.31</tspan></text>
    <text x="0" y="132" class="mono font-14 text-dim">SERIAL    : <tspan class="text-white">7524129823004A</tspan></text>

    <!-- Right Column: Timeline -->
    <g transform="translate(420, 0)">
      <!-- Line running down -->
      <line x1="6" y1="0" x2="6" y2="135" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
      
      <!-- Phase 1 -->
      <circle cx="6" cy="0" r="4" fill="#000" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
      <text x="25" y="4" class="mono font-14 text-white">Phase 01 ── <tspan class="text-cyan">AUTOMATION  [2018–2020]</tspan></text>
      <text x="25" y="20" class="mono font-12 text-dark">└── IFIMIA Casablanca (PLC Logic · Robotic Arms)</text>

      <!-- Phase 2 -->
      <circle cx="6" cy="40" r="4" fill="#000" stroke="#22d3ee" stroke-width="2" />
      <text x="25" y="44" class="mono font-14 text-white">Phase 02 ── <tspan class="text-cyan">PRECISION   [2020–2022]</tspan></text>
      <text x="25" y="60" class="mono font-12 text-dark">└── Dental Tech (10μm Accuracy · CAD/CAM)</text>

      <!-- Phase 3 -->
      <circle cx="6" cy="80" r="4" fill="#000" stroke="#22d3ee" stroke-width="2" />
      <text x="25" y="84" class="mono font-14 text-white">Phase 03 ── <tspan class="text-cyan">STRATEGY    [2022–2023]</tspan></text>
      <text x="25" y="100" class="mono font-12 text-dark">└── Pro-Gamer · KIC Seoul Rank</text>

      <!-- Phase 4 -->
      <circle cx="6" cy="120" r="4" fill="#000" stroke="#ef4444" stroke-width="2" filter="url(#glow)"/>
      <text x="25" y="124" class="mono font-14 text-white">Phase 04 ── <tspan class="text-red">SOFTWARE    [PRESENT ██]</tspan></text>
      <text x="25" y="140" class="mono font-12 text-dark">└── 1337 (42 Network) (Low-Level Systems Arch.)</text>
    </g>
  </g>
  
  <rect x="0" y="0" width="800" height="250" fill="url(#scanlines)" opacity="0.6" pointer-events="none" />
</svg>
